name: offline_trip
description: Shared offline taxi meter and bundled Sri Lanka navigation.
version: 1.0.0
publish_to: none
environment:
  sdk: ^3.10.4
dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.2
  dio: ^5.8.0+1
  flutter_map: ^8.2.2
  latlong2: ^0.10.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path_provider: ^2.1.5
  file_selector: ^1.0.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/sri_lanka.nav.gz
    - assets/manifest.json
    - assets/NOTICE.txt

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Run Kotlin in Gradle to avoid compiler daemon connection resets.
kotlin.compiler.execution.strategy=in-process
# Also apply to included builds, including Flutter's Gradle plugin.
systemProp.org.gradle.project.kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.incremental=false

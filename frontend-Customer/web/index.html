<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RideX">
  <link rel="apple-touch-icon" href="RideX.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="RideX.png"/>

  <title>RideX</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps for Flutter Web requires a valid Maps JavaScript API browser key.
    Replace the placeholder below with your own website-restricted key.
  -->
  <script src="maps_config.js"></script>
  <script>
    function startFlutter() {
      if (!document.body) {
        window.addEventListener('DOMContentLoaded', startFlutter, { once: true });
        return;
      }
      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    }

    const mapsApiKey = window.__GOOGLE_MAPS_API_KEY__ || "";

    if (!mapsApiKey) {
      console.error(
        "Google Maps could not be loaded because no valid API key is configured. " +
        "Set window.__GOOGLE_MAPS_API_KEY__ in this page or replace the placeholder in web/index.html with your Google Maps browser key."
      );
      window.addEventListener('DOMContentLoaded', startFlutter, { once: true });
    } else {
      const script = document.createElement("script");
      script.src = `https://maps.googleapis.com/maps/api/js?key=${mapsApiKey}`;
      script.onload = startFlutter;
      script.onerror = startFlutter;
      document.head.appendChild(script);
    }
  </script>
</head>
<body>
</body>
</html>
